# Spring application
spring.application.name=shebadesk

# MySQL datasource (env-based: works in Docker via compose, overridable locally)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/shebadesk_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate (schema managed by Flyway; validate only)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Server port
server.port=${SERVER_PORT:4000}

# Logging
logging.level.root=info

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
